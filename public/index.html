<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>smileChatBot — LINE Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
    * { font-family: 'Noto Sans Thai', sans-serif; }
    body { background: #1a1a2e; }

    .line-green { background: #06C755; }
    .chat-bg { background: #1a1c2a; }
    .bubble-user { background: #06C755; border-radius: 18px 18px 4px 18px; }
    .bubble-bot { background: #2a2d3e; border-radius: 18px 18px 18px 4px; }
    .quick-reply { background: rgba(6,199,85,0.12); border: 1px solid rgba(6,199,85,0.3); color: #06C755; border-radius: 20px; }
    .quick-reply:hover { background: rgba(6,199,85,0.25); }
    .input-bar { background: #1e2130; border-top: 1px solid rgba(255,255,255,0.07); }
    .typing-dot { animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

    .msg-enter { animation: slideIn 0.25s ease-out; }
    @keyframes slideIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .confidence-high { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
    .confidence-medium { background: rgba(250,204,21,0.15); border: 1px solid rgba(250,204,21,0.3); color: #facc15; }
    .confidence-low { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }

    .action-tag { background: rgba(6,199,85,0.15); color: #06C755; }
    .action-flag { background: rgba(250,204,21,0.15); color: #facc15; }
    .action-refuse { background: rgba(239,68,68,0.15); color: #f87171; }

    .header-blur { backdrop-filter: blur(12px); background: rgba(6,199,85,0.92); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-sm h-[720px] flex flex-col rounded-3xl overflow-hidden shadow-2xl shadow-black/60 border border-white/5">

    <!-- LINE Header -->
    <div class="header-blur px-4 py-3 flex items-center gap-3 z-10">
      <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">S</div>
      <div class="flex-1 min-w-0">
        <div class="text-white font-semibold text-sm leading-tight">smileChatBot</div>
        <div id="online-status" class="text-green-100/70 text-xs">กำลังเชื่อมต่อ...</div>
      </div>
      <button onclick="clearChat()" title="Clear chat" class="text-white/60 hover:text-white transition p-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>

    <!-- Chat Area -->
    <div id="chat" class="flex-1 overflow-y-auto px-3 py-4 space-y-3 chat-bg">

      <!-- Welcome bubble -->
      <div class="flex items-end gap-2 msg-enter">
        <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">S</div>
        <div class="bubble-bot px-4 py-3 max-w-[78%]">
          <p class="text-gray-100 text-sm leading-relaxed">สวัสดีครับ! ผมคือ smileChatBot 🤖</p>
          <p class="text-gray-400 text-xs mt-1">ส่งข้อความเพื่อทดสอบระบบ AI Intent Tagging</p>
        </div>
      </div>

      <!-- Quick reply row -->
      <div id="quick-replies" class="flex flex-wrap gap-2 pl-10 msg-enter">
        <button onclick="sendQuick('ขอใบเสนอราคาสินค้าด้วยครับ')" class="quick-reply text-xs px-3 py-1.5 transition">📋 ขอใบเสนอราคา</button>
        <button onclick="sendQuick('กำลังพิจารณาสินค้าอยู่ครับ')" class="quick-reply text-xs px-3 py-1.5 transition">🤔 กำลังพิจารณา</button>
        <button onclick="sendQuick('สวัสดีครับ มีอะไรแนะนำไหม')" class="quick-reply text-xs px-3 py-1.5 transition">💬 ทั่วไป</button>
      </div>

    </div>

    <!-- Typing Indicator (hidden) -->
    <div id="typing-indicator" class="hidden px-3 pb-2 chat-bg">
      <div class="flex items-end gap-2">
        <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">S</div>
        <div class="bubble-bot px-4 py-3 flex gap-1 items-center">
          <span class="typing-dot w-2 h-2 rounded-full bg-gray-400 block"></span>
          <span class="typing-dot w-2 h-2 rounded-full bg-gray-400 block"></span>
          <span class="typing-dot w-2 h-2 rounded-full bg-gray-400 block"></span>
        </div>
      </div>
    </div>

    <!-- Input Bar -->
    <div class="input-bar px-3 py-3 flex items-center gap-2">
      <input id="msg-input" type="text" placeholder="พิมพ์ข้อความ..."
        class="flex-1 bg-white/8 border border-white/10 rounded-full px-4 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-green-500/50 transition"
        onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()"
        class="w-10 h-10 line-green rounded-full flex items-center justify-center flex-shrink-0 hover:brightness-110 transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    let logCount = 0;

    async function checkHealth() {
      try {
        const r = await fetch('/health');
        const d = await r.json();
        document.getElementById('online-status').textContent = d.mock ? 'Mock Mode • Online' : 'Online';
      } catch {
        document.getElementById('online-status').textContent = 'ออฟไลน์';
      }
    }

    function appendUserBubble(text) {
      const chat = document.getElementById('chat');
      const el = document.createElement('div');
      el.className = 'flex justify-end msg-enter';
      el.innerHTML = `
        <div class="bubble-user px-4 py-2.5 max-w-[78%]">
          <p class="text-white text-sm leading-relaxed">${escHtml(text)}</p>
        </div>`;
      chat.appendChild(el);
      scrollBottom();
    }

    function appendBotCard(log) {
      const chat = document.getElementById('chat');
      const cs = log.output?.confidence_signal || {};
      const level = cs.level || (log.refusal_reason ? 'low' : 'unknown');
      const tag = log.output?.answer_summary?.tag || log.ai_suggestion || '—';
      const desc = log.output?.answer_summary?.description || log.refusal_reason || '';
      const action = log.output?.recommended_action || (log.refusal_reason ? 'refuse' : '—');
      const score = cs.weighted_final !== undefined ? (cs.weighted_final * 100).toFixed(0) + '%' : '';
      const section = log.output?.source_evidence?.section ? `§${log.output.source_evidence.section}` : '';
      const missingInfo = log.output?.missing_information;

      const levelClass = { high: 'confidence-high', medium: 'confidence-medium', low: 'confidence-low' }[level] || 'confidence-low';
      const levelLabel = { high: 'HIGH', medium: 'MEDIUM', low: 'LOW' }[level] || level.toUpperCase();
      const actionClass = { tag: 'action-tag', tag_with_flag: 'action-flag', refuse: 'action-refuse' }[action] || 'action-refuse';
      const actionLabel = { tag: '✓ Tagged', tag_with_flag: '⚑ Flagged', refuse: '✕ Refused' }[action] || action;

      const el = document.createElement('div');
      el.className = 'flex items-end gap-2 msg-enter';
      el.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">S</div>
        <div class="bubble-bot px-4 py-3 max-w-[82%] space-y-2.5">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs px-2 py-0.5 rounded-full font-bold ${levelClass}">${levelLabel} ${score}</span>
            <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${actionClass}">${actionLabel}</span>
          </div>
          <div>
            <div class="text-white font-bold text-base leading-tight">${escHtml(tag)}</div>
            ${section ? `<div class="text-gray-500 text-xs mt-0.5">Rulebook ${escHtml(section)}</div>` : ''}
          </div>
          <p class="text-gray-300 text-xs leading-relaxed">${escHtml(desc)}</p>
          ${missingInfo ? `<div class="bg-yellow-500/10 border border-yellow-500/20 rounded-lg px-3 py-2 text-yellow-300 text-xs">⚠ ${escHtml(missingInfo)}</div>` : ''}
          <div class="flex gap-3 text-gray-600 text-xs pt-0.5">
            <span>vector ${(cs.vector_similarity * 100 || 0).toFixed(0)}%</span>
            <span>llm ${(cs.llm_self_score * 100 || 0).toFixed(0)}%</span>
            <span class="ml-auto opacity-50">${log.case_id || ''}</span>
          </div>
        </div>`;
      chat.appendChild(el);
      scrollBottom();
    }

    function showTyping(show) {
      document.getElementById('typing-indicator').classList.toggle('hidden', !show);
      if (show) scrollBottom();
    }

    function scrollBottom() {
      const chat = document.getElementById('chat');
      chat.scrollTop = chat.scrollHeight;
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await send(text);
    }

    async function sendQuick(text) {
      await send(text);
    }

    async function send(text) {
      appendUserBubble(text);
      showTyping(true);

      const payload = {
        events: [{
          type: 'message',
          message: { type: 'text', id: Date.now().toString(), text },
          source: { type: 'user', userId: 'Udemo' + Math.random().toString(36).slice(2, 6) },
          replyToken: 'mock-reply-token',
          timestamp: Date.now()
        }]
      };

      try {
        await fetch('/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        await new Promise(res => setTimeout(res, 700));

        const { logs } = await fetch('/mock/results').then(r => r.json());
        showTyping(false);

        if (logs && logs.length > logCount) {
          logCount = logs.length;
          appendBotCard(logs[logs.length - 1]);
        }
      } catch (err) {
        showTyping(false);
        const chat = document.getElementById('chat');
        const el = document.createElement('div');
        el.className = 'flex items-end gap-2 msg-enter';
        el.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center text-white text-xs font-bold">!</div>
          <div class="bubble-bot px-4 py-2.5"><p class="text-red-400 text-sm">เกิดข้อผิดพลาด กรุณาลองใหม่</p></div>`;
        chat.appendChild(el);
        scrollBottom();
      }
    }

    async function clearChat() {
      await fetch('/mock/reset', { method: 'POST' });
      logCount = 0;
      const chat = document.getElementById('chat');
      chat.innerHTML = `
        <div class="flex items-end gap-2 msg-enter">
          <div class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">S</div>
          <div class="bubble-bot px-4 py-3 max-w-[78%]">
            <p class="text-gray-100 text-sm leading-relaxed">สวัสดีครับ! ผมคือ smileChatBot 🤖</p>
            <p class="text-gray-400 text-xs mt-1">ส่งข้อความเพื่อทดสอบระบบ AI Intent Tagging</p>
          </div>
        </div>
        <div id="quick-replies" class="flex flex-wrap gap-2 pl-10 msg-enter">
          <button onclick="sendQuick('ขอใบเสนอราคาสินค้าด้วยครับ')" class="quick-reply text-xs px-3 py-1.5 transition">📋 ขอใบเสนอราคา</button>
          <button onclick="sendQuick('กำลังพิจารณาสินค้าอยู่ครับ')" class="quick-reply text-xs px-3 py-1.5 transition">🤔 กำลังพิจารณา</button>
          <button onclick="sendQuick('สวัสดีครับ มีอะไรแนะนำไหม')" class="quick-reply text-xs px-3 py-1.5 transition">💬 ทั่วไป</button>
        </div>`;
    }

    checkHealth();
  </script>
</body>
</html>
