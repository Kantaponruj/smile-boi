<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>smileChatBot — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-mono">

  <div class="max-w-3xl mx-auto px-4 py-10 space-y-8">

    <!-- Header -->
    <div>
      <h1 class="text-2xl font-bold text-green-400">smileChatBot</h1>
      <p class="text-gray-400 text-sm mt-1">Evidence-Gated AI Intent Tagging Engine — Mock Demo</p>
      <div id="status-badge" class="inline-block mt-2 px-2 py-0.5 rounded text-xs bg-gray-800 text-gray-400">checking...</div>
    </div>

    <!-- Send Message -->
    <div class="bg-gray-900 rounded-xl p-6 space-y-4">
      <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Send Test Message</h2>

      <div class="grid grid-cols-3 gap-2">
        <button onclick="setPreset('high')" class="preset-btn bg-green-900 hover:bg-green-800 text-green-200 text-xs py-2 px-3 rounded-lg transition">
          HIGH confidence<br/><span class="text-green-400 font-semibold">ขอใบเสนอราคา</span>
        </button>
        <button onclick="setPreset('medium')" class="preset-btn bg-yellow-900 hover:bg-yellow-800 text-yellow-200 text-xs py-2 px-3 rounded-lg transition">
          MEDIUM confidence<br/><span class="text-yellow-400 font-semibold">กำลังพิจารณาสินค้า</span>
        </button>
        <button onclick="setPreset('low')" class="preset-btn bg-red-900 hover:bg-red-800 text-red-200 text-xs py-2 px-3 rounded-lg transition">
          LOW confidence<br/><span class="text-red-400 font-semibold">สวัสดีครับ</span>
        </button>
      </div>

      <div class="flex gap-2">
        <input id="message-input" type="text" placeholder="พิมพ์ข้อความ..." value="ขอใบเสนอราคา"
          class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-green-500 placeholder-gray-600" />
        <button onclick="sendMessage()"
          class="bg-green-600 hover:bg-green-500 text-white text-sm px-5 py-2 rounded-lg font-semibold transition">
          Send
        </button>
      </div>
    </div>

    <!-- Last Response -->
    <div id="response-box" class="hidden bg-gray-900 rounded-xl p-6 space-y-3">
      <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Last Response</h2>
      <div id="confidence-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold"></div>
      <div id="tag-display" class="text-xl font-bold text-white"></div>
      <div id="description-display" class="text-sm text-gray-400"></div>
      <details class="mt-2">
        <summary class="text-xs text-gray-500 cursor-pointer hover:text-gray-300">Raw JSON</summary>
        <pre id="raw-json" class="mt-2 text-xs text-gray-400 overflow-auto bg-gray-800 rounded p-3 max-h-48"></pre>
      </details>
    </div>

    <!-- Logs -->
    <div class="bg-gray-900 rounded-xl p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Mock Logs</h2>
        <div class="flex gap-2">
          <button onclick="fetchLogs()" class="text-xs text-gray-400 hover:text-white border border-gray-700 hover:border-gray-500 px-3 py-1 rounded-lg transition">Refresh</button>
          <button onclick="resetLogs()" class="text-xs text-red-400 hover:text-white border border-red-900 hover:border-red-500 px-3 py-1 rounded-lg transition">Reset</button>
        </div>
      </div>
      <div id="logs-container" class="space-y-2 text-xs">
        <p class="text-gray-600">No logs yet.</p>
      </div>
    </div>

  </div>

  <script>
    const PRESETS = {
      high:   'ขอใบเสนอราคา',
      medium: 'กำลังพิจารณาสินค้า',
      low:    'สวัสดีครับ'
    };

    function setPreset(level) {
      document.getElementById('message-input').value = PRESETS[level];
    }

    async function checkHealth() {
      try {
        const r = await fetch('/health');
        const d = await r.json();
        const badge = document.getElementById('status-badge');
        if (d.status === 'ok') {
          badge.textContent = `● online  mock=${d.mock}`;
          badge.className = 'inline-block mt-2 px-2 py-0.5 rounded text-xs bg-green-900 text-green-300';
        }
      } catch {
        const badge = document.getElementById('status-badge');
        badge.textContent = '● offline';
        badge.className = 'inline-block mt-2 px-2 py-0.5 rounded text-xs bg-red-900 text-red-300';
      }
    }

    async function sendMessage() {
      const text = document.getElementById('message-input').value.trim();
      if (!text) return;

      const payload = {
        events: [{
          type: 'message',
          message: { type: 'text', id: Date.now().toString(), text },
          source: { type: 'user', userId: 'Udemo' + Math.random().toString(36).slice(2, 6) },
          replyToken: 'mock-reply-token',
          timestamp: Date.now()
        }]
      };

      try {
        const r = await fetch('/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // webhook returns 200 "OK" text immediately, result is async
        // wait briefly then fetch logs
        await new Promise(res => setTimeout(res, 600));
        await fetchLogs();

        // show latest log as response
        const logs = await fetch('/mock/results').then(r => r.json());
        if (logs.logs && logs.logs.length > 0) {
          showResponse(logs.logs[logs.logs.length - 1]);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function showResponse(log) {
      const box = document.getElementById('response-box');
      box.classList.remove('hidden');

      const level = log.output?.confidence_signal?.level || log.confidence_final ? 'low' : 'unknown';
      const tag = log.output?.answer_summary?.tag || log.ai_suggestion || '(refused)';
      const desc = log.output?.answer_summary?.description || log.refusal_reason || '';
      const confidence = log.output?.confidence_signal || {};

      const badge = document.getElementById('confidence-badge');
      const levelVal = confidence.level || (log.refusal_reason ? 'low' : 'unknown');
      const colors = { high: 'bg-green-800 text-green-200', medium: 'bg-yellow-800 text-yellow-200', low: 'bg-red-800 text-red-200', unknown: 'bg-gray-700 text-gray-300' };
      badge.className = `inline-block px-3 py-1 rounded-full text-xs font-bold ${colors[levelVal] || colors.unknown}`;
      badge.textContent = `${levelVal.toUpperCase()}  ${confidence.weighted_final !== undefined ? (confidence.weighted_final * 100).toFixed(0) + '%' : ''}`;

      document.getElementById('tag-display').textContent = tag;
      document.getElementById('description-display').textContent = desc;
      document.getElementById('raw-json').textContent = JSON.stringify(log, null, 2);
    }

    async function fetchLogs() {
      try {
        const r = await fetch('/mock/results');
        const { logs } = await r.json();
        const container = document.getElementById('logs-container');

        if (!logs || logs.length === 0) {
          container.innerHTML = '<p class="text-gray-600">No logs yet.</p>';
          return;
        }

        container.innerHTML = [...logs].reverse().map(log => {
          const level = log.output?.confidence_signal?.level || (log.refusal_reason ? 'low' : 'unknown');
          const tag = log.output?.answer_summary?.tag || log.ai_suggestion || '—';
          const score = log.output?.confidence_signal?.weighted_final;
          const action = log.output?.recommended_action || (log.refusal_reason ? 'refuse' : '—');
          const colors = { high: 'border-green-800 text-green-400', medium: 'border-yellow-800 text-yellow-400', low: 'border-red-800 text-red-400', unknown: 'border-gray-700 text-gray-400' };
          const cls = colors[level] || colors.unknown;

          return `
            <div class="border-l-2 ${cls} pl-3 py-1 bg-gray-800 rounded-r-lg">
              <div class="flex items-center gap-2">
                <span class="font-bold">${tag}</span>
                <span class="text-gray-500">${log.case_id}</span>
                <span class="ml-auto">${level.toUpperCase()} ${score !== undefined ? (score * 100).toFixed(0) + '%' : ''}</span>
                <span class="text-gray-500">${action}</span>
              </div>
              ${log.refusal_reason ? `<div class="text-gray-500 mt-0.5">${log.refusal_reason}</div>` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function resetLogs() {
      await fetch('/mock/reset', { method: 'POST' });
      document.getElementById('response-box').classList.add('hidden');
      await fetchLogs();
    }

    checkHealth();
    fetchLogs();
  </script>
</body>
</html>
